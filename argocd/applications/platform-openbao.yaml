apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-openbao
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: Prune=confirm
spec:
  project: platform
  sources:
    - repoURL: https://openbao.github.io/openbao-helm
      chart: openbao
      targetRevision: 0.28.5
      helm:
        releaseName: openbao
        valueFiles:
          - $values/platform-values/openbao/values.yaml
    - repoURL: git@github.com:bertughas123/rke2-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
