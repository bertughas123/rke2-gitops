fullnameOverride: demo-app

replicaCount: 1

image:
  repository: ghcr.io/bertughas123/app-for-gitops
  pullPolicy: IfNotPresent
  tag: "git-e19bd71"

imagePullSecrets: []

containerPort: 3000

securityContext:
  runAsUser: 1000
  runAsGroup: 1000

env:
- name: APP_VERSION
  value: "git-e19bd71"

service:
  type: ClusterIP
  port: 80
  targetPort: http

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
  - host: demo.192.168.252.2.sslip.io
    paths:
    - path: /
      pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

autoscaling:
  enabled: false

networkPolicy:
  enabled: false
